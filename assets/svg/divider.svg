<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5C451" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="5" width="1200" height="2" fill="url(#line)"/>
  <circle cy="6" r="4" fill="#F5C451">
    <animate attributeName="cx" from="0" to="1200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
