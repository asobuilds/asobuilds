<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Agene Sunday Okoh</title>
  <desc id="d">AI-Native Full-Stack Solutions Engineer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2745" stroke-width="1"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="70" y="96" height="80" width="0">
        <animate attributeName="width" from="0" to="820" dur="1.6s" begin="0.3s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.6"/>

  <g clip-path="url(#reveal)">
    <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56"
          font-weight="700" letter-spacing="2" fill="url(#accent)">AGENE SUNDAY OKOH</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#CBD5E1">
    <text x="82" y="205" opacity="0">AI-Native Full-Stack Solutions Engineer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="82" y="205" opacity="0">Go  ·  Rust  ·  Python  ·  TypeScript  ·  Docker  ·  Redis
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="5s" repeatCount="indefinite"/>
    </text>
    <text x="82" y="205" opacity="0">Resilient systems for constrained networks
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="82" y="232" height="3" rx="1.5" width="0" fill="url(#accent)">
    <animate attributeName="width" from="0" to="260" dur="1.2s" begin="1.6s" fill="freeze"/>
  </rect>

  <circle cx="1000" cy="170" r="110" fill="url(#glow)">
    <animate attributeName="r" values="95;120;95" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <path d="M1000 90 L1062 113 V176 C1062 216 1033 240 1000 252 C967 240 938 216 938 176 V113 Z"
        fill="#0F1A30" stroke="url(#accent)" stroke-width="3"/>
  <path d="M970 172 L992 194 L1032 148" fill="none" stroke="#2DD4BF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1s" begin="1.2s" fill="freeze"/>
  </path>

  <circle r="5" fill="#818CF8">
    <animateMotion dur="6s" repeatCount="indefinite" path="M1000 50 a120 120 0 1 1 -0.1 0"/>
  </circle>

  <rect x="0" y="312" width="1200" height="2" fill="#1B2745"/>
  <rect y="311" width="160" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="x" from="-160" to="1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
